.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:11px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--input);color:var(--text);font-weight:600;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{border-color:var(--brand);background:rgba(0,144,176,.12);color:var(--brand)}
.meter{display:flex;gap:4px;margin-top:8px}
.meter span{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .2s}

      <i><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3z" />
        <path fill="currentColor" opacity=".75" d="M5 13.2V17c0 1.7 3.1 3 7 3s7-1.3 7-3v-3.8l-7 3.8-7-3.8z" />
      </svg></i>
      <span>Qaz<b>Course</b></span>
    </div>
  );
}

function Field({ id, label, error, children }) {
  return (
    <div className="f">
      <label htmlFor={id}>{label}</label>
      {children}
      {error && <p className="err" id={id + "-e"}>{error}</p>}
    </div>
  );
}

function Auth({ onDone }) {
  const [mode, setMode] = useState("login");
  const [v, setV] = useState({ name: "", email: "", password: "", role: "student", agree: false });
  const [errs, setErrs] = useState({});
  const [show, setShow] = useState(false);
  const [busy, setBusy] = useState(false);
  const [fail, setFail] = useState("");
  const reg = mode === "register";
  const set = k => e => setV({ ...v, [k]: e.target.type === "checkbox" ? e.target.checked : e.target.value });
  const s = strength(v.password);

  function validate() {
    const e = {};
    if (reg && v.name.trim().length < 2) e.name = "Атыңызды енгізіңіз (кемінде 2 таңба)";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) e.email = "Жарамды email енгізіңіз";
    if (!v.password) e.password = "Құпиясөзді енгізіңіз";
    else if (reg && v.password.length < 8) e.password = "Кемінде 8 таңба";
    if (reg && !v.agree) e.agree = "Аккаунт жасау үшін келісім қажет";
    return e;
  }

  async function submit(ev) {
    ev.preventDefault();
    const er = validate();
    setErrs(er);
    if (Object.keys(er).length) return;
    setBusy(true); setFail("");
    try {
      const u = reg ? await api.register(v) : await api.login(v);
      store.set(u);
      onDone(u, reg);
    } catch (x) {
      setFail("Сұранысты орындау мүмкін болмады. Қайталап көріңіз.");
      setBusy(false);
    }
  }

  return (
    <div className="card">
      <div className="tabs" role="tablist">
        {[["login", "Кіру"], ["register", "Тіркелу"]].map(([k, t]) => (
          <button key={k} type="button" role="tab" aria-selected={mode === k}
            onClick={() => { setMode(k); setErrs({}); setFail(""); }}>{t}</button>
        ))}
      </div>
      <h2>{reg ? "Аккаунт жасаңыз" : "Қайта келгеніңізбен!"}</h2>
      <p className="sub">{reg ? "Бірнеше минутта оқуды бастаңыз" : "Оқуды жалғастыру үшін жүйеге кіріңіз"}</p>
      {fail && <div className="banner" role="alert">{fail}</div>}

      <form onSubmit={submit} noValidate>
        {reg && (
          <Field id="name" label="Атыңыз" error={errs.name}>
            <input id="name" type="text" autoComplete="name" placeholder="Мақсат"
              value={v.name} onChange={set("name")} aria-invalid={!!errs.name} />
          </Field>
        )}
        <Field id="email" label="Email" error={errs.email}>
          <input id="email" type="email" autoComplete="email" placeholder="name@example.com"
            value={v.email} onChange={set("email")} aria-invalid={!!errs.email} />
        </Field>
        <Field id="password" label="Құпиясөз" error={errs.password}>
          <div className="in">
            <input id="password" type={show ? "text" : "password"}
              autoComplete={reg ? "new-password" : "current-password"}
              placeholder={reg ? "Кемінде 8 таңба" : "Сіздің құпиясөзіңіз.."}
              value={v.password} onChange={set("password")} aria-invalid={!!errs.password} />
            <button type="button" className="show" onClick={() => setShow(!show)}>{show ? "Жасыру" : "Көрсету"}</button>
          </div>
          {reg && v.password && (
            <div className="meter" aria-live="polite">
              {[1, 2, 3, 4].map(i => <span key={i} style={{ background: i <= s ? COLORS[s] : undefined }} />)}
              <small>{LEVELS[s]}</small>
            </div>
          )}
        </Field>
        {reg && (
          <div className="f">
            <label>Я хочу</label>
            <div className="seg">
              {[["student", "🎓 Оқу"], ["author", "✍️ Оқыту"]].map(([k, t]) => (
                <button key={k} type="button" aria-pressed={v.role === k} onClick={() => setV({ ...v, role: k })}>{t}</button>
              ))}
            </div>
          </div>
        )}
        {reg && (
          <div className="f">
            <label className="chk">
              <input type="checkbox" checked={v.agree} onChange={set("agree")} />
              <span>Жеке деректерді өңдеуге келісемін және пайдалану шарттарын қабылдаймын</span>
            </label>
            {errs.agree && <p className="err">{errs.agree}</p>}
          </div>
        )}
        <button className="btn" type="submit" disabled={busy}>
          {busy ? "Күтіңіз..." : reg ? "Аккаунт жасау" : "Кіру"}
        </button>
      </form>
      <p className="note">Демо-версия: данные не отправляются на сервер.</p>
    </div>
  );
}

const SAMPLES = [
  { t: "Python нөлден", m: "Бағдарламалау · 12 сабақ", c: "linear-gradient(135deg,#0090b0,#2cc4e4)", i: "🐍" },
  { t: "SQL негіздері", m: "Деректер қоры · 8 сабақ", c: "linear-gradient(135deg,#f5b800,#ffd23f)", i: "🗄️" },
  { t: "Бастаушыларға арналған веб-дизайн", m: "Дизайн · 10 сабақ", c: "linear-gradient(135deg,#7b61ff,#a99bff)", i: "🎨" }
];

function Profile({ user, fresh, onOut }) {
  const [welcome, setWelcome] = useState(fresh);
  const author = user.role === "author";
  const initial = (user.name || user.email).trim().charAt(0).toUpperCase();
  const labels = author ? ["Менің курстарым", "Студенттер", "Жарияланған"] : ["Жазылған курстар", "Аяқталған", "Сертификаттар"];
  return (
    <div className="prof">
      <header className="ptop">
        <Logo />
        <div className="who">
          <span className="av">{initial}</span>
          <button className="out" onClick={onOut}>Шығу</button>
        </div>
      </header>
      <main className="pmain">
        {welcome && (
          <div className="welc" role="status">
            <span>🎉 Тіркелу сәтті өтті! QazCourse-қа қош келдіңіз.</span>
            <button onClick={() => setWelcome(false)} aria-label="Жабу">✕</button>
          </div>
        )}
        <section className="card phero">
          <span className="av lg">{initial}</span>
          <div>
            <h1>Сәлем, {user.name}! 👋</h1>
            <span className="badge">{author ? "✍️ Автор" : "🎓 Студент"}</span>
            <p className="mail">{user.email}</p>
          </div>
        </section>
        <section className="stats">
          {labels.map(l => <div className="stat" key={l}><b>0</b><span>{l}</span></div>)}
        </section>
        <h2 className="ph">Ұсынылатын курстар <small>демо</small></h2>
        <div className="pgrid">
          {SAMPLES.map(c => (
            <article className="pc" key={c.t}>
              <div className="cv" style={{ "--c": c.c }}>{c.i}</div>
              <div className="cb"><h3>{c.t}</h3><p>{c.m}</p></div>
            </article>
          ))}
        </div>
      </main>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(store.get());
  const [fresh, setFresh] = useState(false);
  useEffect(() => { document.body.classList.toggle("profile", !!user); }, [user]);
  if (user) {
    return <Profile user={user} fresh={fresh} onOut={() => { store.set(null); setUser(null); setFresh(false); }} />;
  }
  return (
    <div className="shell">
      <div className="stack">
        <div className="mlogo"><Logo /></div>
        <Auth onDone={(u, isNew) => { setFresh(!!isNew); setUser(u); }} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
